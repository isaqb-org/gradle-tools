import org.asciidoctor.gradle.jvm.AsciidoctorTask
import org.asciidoctor.gradle.jvm.pdf.AsciidoctorPdfTask

import java.text.ParseException
import java.text.SimpleDateFormat


plugins {
    id 'application'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.asciidoctor.jvm.pdf' version '4.0.5'
}

repositories {
    mavenCentral()
}

pdfThemes {
    local 'isaqb', {
        themeDir = '../pdf-theme/themes'
        themeName = 'isaqb'
    }
}

ext {

    workDirectory = rootProject.projectDir
    project.version = System.getenv("RELEASE_VERSION") ?: "LocalBuild"
    versionDate = new SimpleDateFormat("yyyyMMdd").format(new Date())
    curriculumFileName = rootProject.curriculumFileName
    validity = rootProject.findProperty("validity")
    languages = rootProject.findProperty("languages") ?: ["DE", "EN"]
    suffixTags = rootProject.findProperty("suffixTags") ? rootProject.suffixTags : [""]
    prepress = Boolean.parseBoolean((rootProject.findProperty("prepress") ?: false).toString())
}

asciidoctorj {
    version = '3.0.1'
    docExtensions new File("${projectDir}/SpecialTocTreeprocessor.groovy")
    requires "${projectDir}/robust-page-numbering.rb"
}

static def formatValidity(validity, language) {
    if (validity) {
        try {
            def parsedValidity = new SimpleDateFormat("yyyy/MM/dd", Locale.US).parse(validity as String)
            return language == "DE" ? " (Gültig ab " + new SimpleDateFormat("d. MMMM yyyy", Locale.GERMANY).format(parsedValidity) + ")"
                    : " (valid from " + new SimpleDateFormat("MMMM d, yyyy", Locale.US).format(parsedValidity) + ")"
        } catch (ParseException e) {
            return ""
        }
    }

    return ""
}

// Automatische Task-Erstellung für PDF & HTML
def registerAsciiDocTask(String format, Class<?> taskType) {
    languages.each { lang ->
        suffixTags.each { suffix ->
            tasks.register("${format}${lang}${suffix}", taskType) {

                jvm {
                    def extraJvmArgs = ["--add-opens", "java.base/sun.nio.ch=ALL-UNNAMED",
                                        "--add-opens", "java.base/java.io=ALL-UNNAMED",
                                        "--enable-native-access=ALL-UNNAMED"]
                    // Only valid on JDK 23+ (JEP 471); the warning it silences also only
                    // appears there. Guard it so JDK 21 builds don't fail on an unknown flag.
                    if (JavaVersion.current().majorVersion.toInteger() >= 23) {
                        extraJvmArgs << "--sun-misc-unsafe-memory-access=allow"
                    }
                    jvmArgs(extraJvmArgs)
                }

                sourceDir = file("${workDirectory}/docs/")
                baseDir = file("${workDirectory}/docs/")
                sources {
                    include format == "pdf" ? "${curriculumFileName}.adoc" : ["index.adoc", "${curriculumFileName}.adoc"]
                }

                outputDir = file("${workDirectory}/build/")

                def fileVersion = "${project.version.trim()}-${lang}"

                def attrs = ['icons'                : 'font',
                             'version-label'        : '',
                             'revnumber'            : fileVersion,
                             'revdate'              : versionDate,
                             'document-version'     : "${fileVersion}-${versionDate}${formatValidity(validity, lang)}",
                             'currentDate'          : versionDate,
                             'release-version'      : project.version,
                             'language'             : lang,
                             'curriculumFileName'   : curriculumFileName,
                             'data-uri'             : true,
                             'allow-uri-read'       : true,
                             'include-configuration': "tags=**;${lang};!*",
                             'suffix'               : suffix.toString(),
                ]

                if (format == "pdf") {
                    theme = "isaqb"
                    fontsDirs = ['../pdf-theme/fonts']
                    attrs['compress'] = true
                    // Print/book layout. The document turns this flag into ":media: prepress"
                    // (see docs/config/setup.adoc); the 'media' attribute has no effect when
                    // passed through the attributes map.
                    if (prepress) {
                        attrs['prepress'] = 'true'
                    }
                } else {
                    attrs['stylesheet'] = '../html-theme/adoc-github.css'
                    attrs['stylesheet-dir'] = '../html-theme'
                }

                attributes = attrs

                // Capture file paths at configuration time to avoid project access at execution time
                def suffixPart = suffix ? "-${suffix.toLowerCase()}" : ""
                def sourceFile = file("${workDirectory}/build/${curriculumFileName}.${format}")
                def targetFile = file("${workDirectory}/build/${curriculumFileName}${suffixPart}-${lang.toLowerCase()}.${format}")

                doLast {
                    sourceFile.renameTo(targetFile)
                }
            }
        }
    }
}

// PDF- und HTML-Tasks registrieren
registerAsciiDocTask("pdf", AsciidoctorPdfTask)
registerAsciiDocTask("html", AsciidoctorTask)


application {
    applicationDefaultJvmArgs = ["""--add-opens""", """java.base/sun.nio.ch=ALL-UNNAMED""",
                                 """--add-opens""", """java.base/java.io=ALL-UNNAMED""",]
}


// Gruppierungs-Task automatisch aus bestehenden Tasks ableiten
tasks.register('buildDocs') {
    description = 'Grouping task for generating all languages in several formats'
    group = 'documentation'
    dependsOn tasks.matching { it.name.startsWith("pdf") || it.name.startsWith("html") }
}

// Cleanup Task verbessert
clean {
    delete fileTree(dir: "${workDirectory}/build", includes: ['**/*'])
}

// Standard-Task setzen
defaultTasks 'buildDocs'
